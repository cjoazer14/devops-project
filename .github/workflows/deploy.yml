name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image (local CI check)
        run: docker build -t devops-app .

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Stopping old container..."
            docker stop devops-app || true
            docker rm devops-app || true

            echo "Pulling latest code on EC2..."
            if [ -d ~/app ]; then rm -rf ~/app; fi
            git clone https://github.com/${{ github.repository }}.git ~/app

            cd ~/app

            echo "Building Docker image on EC2..."
            docker build -t devops-app .

            echo "Running container..."
            docker run -d -p 80:80 --name devops-app devops-app