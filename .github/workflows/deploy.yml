name: CI-CD ECR to EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-2 \
          | docker login --username AWS --password-stdin 101559246314.dkr.ecr.ap-southeast-2.amazonaws.com

      - name: Build image
        run: docker build -t test-app .

      - name: Tag image
        run: |
          docker tag test-app:latest 101559246314.dkr.ecr.ap-southeast-2.amazonaws.com/test-app:latest

      - name: Push image
        run: |
          docker push 101559246314.dkr.ecr.ap-southeast-2.amazonaws.com/test-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 using SSM
        run: |
          aws ssm send-command \
            --region ap-southeast-2 \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=i-xxxxxxxxxxxxx" \
            --parameters 'commands=["bash /home/ec2-user/deploy.sh"]'